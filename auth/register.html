<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #a5a0a7, #764ba2);
    }

    .container {
        width: 420px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .title {
        text-align: center;
        margin-bottom: 25px;
    }

    .title h1 {
        color: #333;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .title p {
        color: #777;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        color: #444;
        font-size: 14px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
    }

    input:focus,
    select:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .name-row {
        display: flex;
        gap: 12px;
    }

    .name-row .form-group {
        flex: 1;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
        transition: 0.3s;
    }

    button:hover {
        background: #5568d9;
        transform: translateY(-1px);
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
        color: #777;
        font-size: 14px;
    }

    .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .container {
            width: 90%;
            padding: 25px;
        }

        .name-row {
            flex-direction: column;
            gap: 0;
        }
    }</style>
</head>
<body>
    <div class="container">

        <div class="title">
            <h1>Create Account</h1>
            <p>Register your account to get started</p>
        </div>

        <form id="formRegister">

            <div class="name-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input
                        type="text"
                        id="first_name"
                        placeholder="First name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        placeholder="Last name"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="male">ប្រុស</option>
                    <option value="female">ស្រី</option>
                </select>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select id="role">
                    <option value="admin">Admin</option>
                    <option value="staff">Staff</option>
                    <option value="user">User</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Example@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit">Register</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

<script src="../js/auth.js"></script>

</body>
</html>
