<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #a5a0a7, #764ba2);
    }

    .login-container {
        width: 400px;
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .logo {
        width: 65px;
        height: 65px;
        margin: 0 auto 20px;
        border-radius: 50%;
        justify-content: center;
        align-items: center;
        color: rgb(0, 0, 0);
        font-size: 65px;
        font-weight: bold;
    }

    .title {
        text-align: center;
        margin-bottom: 30px;
    }

    .title h1 {
        font-size: 30px;
        color: #333;
        margin-bottom: 8px;
    }

    .title p {
        color: #777;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #444;
        font-size: 14px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
    }

    .form-group input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #5568d9;
        transform: translateY(-1px);
    }

    .register-link {
        text-align: center;
        margin-top: 22px;
        color: #777;
        font-size: 14px;
    }

    .register-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .login-container {
            width: 90%;
            padding: 30px 25px;
        }
    }</style>
</head>
<body>
    <div class="login-container">

        <div class="logo">
            <i class="fa-solid fa-circle-user"></i>
        </div>

        <div class="title">
            <h1>Welcome Back</h1>
            <p>Login to your account</p>
        </div>

        <form id="formlogin" onsubmit="login(event)">

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

<script src="../js/auth.js"></script>


</body>
</html>
