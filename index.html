<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User</title>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background: #f8fafc;
        display: flex;
    }

    .sidebar {
        width: 230px;
        min-height: 100vh;
        background: #0d0c0f;
        color: white;
        padding: 30px 20px;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 40px;
    }

    .menu div {
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 8px;
        cursor: pointer;
        color: #ede9fe;
    }

    .menu div:hover,
    .menu .active {
        background: #8b5cf6;
        color: white;
    }

    .main {
        flex: 1;
        padding: 40px;
    }

    .header {
        margin-bottom: 30px;
    }

    .header h1 {
        color: #4c1d95;
        font-size: 32px;
    }

    .header p {
        color: #64748b;
        margin-top: 8px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h3 {
        color: #64748b;
        font-size: 15px;
        margin-bottom: 12px;
    }

    .card h2 {
        color: #4c1d95;
        font-size: 30px;
    }

    @media (max-width: 800px) {
        .sidebar {
            width: 180px;
        }

        .cards {
            grid-template-columns: 1fr;
        }
    }
</style>


</head>

<body>


<aside class="sidebar">
    <div class="logo">👤 USER</div>

    <div class="menu">
        <div class="active">Dashboard</div>
        <div>My Profile</div>
        <div>Products</div>
        <div>My Orders</div>
        <div>Settings</div>
    </div>
</aside>

<main class="main">

    <div class="header">
        <h1>User Dashboard</h1>
        <p>Welcome back!</p>
    </div>

    <div class="cards">

        <div class="card">
            <h3>My Orders</h3>
            <h2>12</h2>
        </div>

        <div class="card">
            <h3>Products</h3>
            <h2>350</h2>
        </div>

        <div class="card">
            <h3>Completed Orders</h3>
            <h2>10</h2>
        </div>

    </div>

</main>


</body>
<script>
    window.location.href="./auth/login.html"
</script>
</html>
